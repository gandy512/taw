<div class="page">
  <form class="card" #form="ngForm" (ngSubmit)="submit()">
    <h2>Add Student</h2>

    <label>
      Username
      <input type="text" name="username" [(ngModel)]="username" required />
    </label>
    <label>
      Password
      <input type="password" name="password" [(ngModel)]="password" required />
    </label>
    <label>
      Name
      <input type="text" name="name" [(ngModel)]="name" required />
    </label>
    <label>
      Surname
      <input type="text" name="surname" [(ngModel)]="surname" required />
    </label>
    <label>
      Course
      <input type="text" name="course" [(ngModel)]="course" required />
    </label>
    <label>
      Email
      <input type="email" name="email" [(ngModel)]="email" required />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="actions">
      <button type="submit" [disabled]="form.invalid">Create</button>
      <a class="button" routerLink="/admin/students">Cancel</a>
    </div>
  </form>
</div>
